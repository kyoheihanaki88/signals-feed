name: Custom Mix Pool — manual verification

# DEFAULT-BRANCH LAUNCHER. One-off infrastructure verification. Not a daily job.
#
# WHY THIS FILE IS ON MAIN. GitHub only registers a `workflow_dispatch` workflow if the
# file exists on the DEFAULT branch — dispatching a branch-only workflow returns
# "HTTP 404: workflow not found on the default branch", even with --ref set. So the
# launcher lives here, while the implementation it runs stays on the feature branch.
#
# WHY THE DAILY WORKFLOW CANNOT DO THIS. `daily-auto-publish.yml` pins `ref: main` in every
# job, so it can only ever execute main's code. This workflow checks out an explicitly
# named `source_ref` instead, which is the entire reason it exists.
#
# SUPPLY-CHAIN NOTE — READ BEFORE WIDENING THE ALLOWLIST. A default-branch workflow that
# checks out an arbitrary ref AND holds secrets lets anyone who can push a branch run code
# with those secrets. That is why `source_ref` is restricted to a hardcoded allowlist below
# rather than accepting free-form input. Widening it is a security decision, not a
# convenience one. `permissions: contents: read` further ensures this workflow cannot write
# to the repository even if the code it runs tries to.
#
# WHAT IT DELIBERATELY DOES NOT DO:
#   • no standard edition build, no `editions/` file, no `latest.json` change
#   • no branch, commit, tag, release, deployment, PR, merge or push
#   • no route activation — `/api/edition` is untouched and still answers 503
#
# WHAT IT DOES: scout -> build-raw -> validate-raw -> build --raw-input -> ONE atomic
# Upstash SET at
# `signals:editorial-mix-pool:v1:<UTC date>` with TTL 777600. Fails closed below 15
# surviving candidates.

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch holding the Custom Mix implementation (must be on the allowlist)"
        required: true
        default: ""
      date:
        description: "UTC date YYYY-MM-DD — required, must equal today in UTC"
        required: true
      confirm:
        description: 'Type exactly: publish'
        required: true
        default: ""

# Read-only. This workflow cannot create a branch, commit, tag, release or pull request.
permissions:
  contents: read

concurrency:
  group: custom-mix-pool-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Gate FIRST, on the launcher's own code, before a single byte of the feature branch
      # is fetched or executed. Checking out untrusted code and then validating would be
      # the wrong order.
      - name: Gate — source ref, confirmation and UTC date
        id: gate
        env:
          INPUT_SOURCE_REF: ${{ github.event.inputs.source_ref }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail

          # The only refs whose code may run with these secrets. Hardcoded on purpose.
          ALLOWED="feed/dup-story-guard"

          if [ -z "${INPUT_SOURCE_REF:-}" ]; then
            echo "::error::source_ref is required and must not be empty."
            exit 1
          fi
          case "$INPUT_SOURCE_REF" in
            main|master|refs/heads/main|refs/heads/master)
              echo "::error::source_ref must not be main — main does not contain the Custom Mix implementation, and running main here would be pointless and misleading."
              exit 1 ;;
          esac
          if [ "$INPUT_SOURCE_REF" != "$ALLOWED" ]; then
            echo "::error::source_ref '$INPUT_SOURCE_REF' is not on the allowlist ($ALLOWED). Widening the allowlist is a security decision — edit this workflow deliberately."
            exit 1
          fi

          if [ "$INPUT_CONFIRM" != "publish" ]; then
            echo "::error::confirmation input must be exactly 'publish' — refusing."
            exit 1
          fi
          if ! [[ "$INPUT_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::date must be YYYY-MM-DD."
            exit 1
          fi
          UTC_TODAY="$(date -u +%F)"
          echo "source_ref=$INPUT_SOURCE_REF  requested=$INPUT_DATE  utc_today=$UTC_TODAY"
          if [ "$INPUT_DATE" != "$UTC_TODAY" ]; then
            echo "::error::date $INPUT_DATE is not today in UTC ($UTC_TODAY) — refusing to publish a past or future key."
            exit 1
          fi

          echo "date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          echo "source_ref=$INPUT_SOURCE_REF" >> "$GITHUB_OUTPUT"
          {
            echo "## Custom Mix Pool verification — $INPUT_DATE (UTC)"
            echo "Implementation ref: \`$INPUT_SOURCE_REF\` · launcher: default branch"
          } >> "$GITHUB_STEP_SUMMARY"

      # The implementation comes from the gated source_ref, NOT from main.
      - name: Checkout the implementation ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.gate.outputs.source_ref }}

      - name: Confirm the checked-out ref carries the implementation
        run: |
          set -euo pipefail
          for f in pipeline/editorial_mix_pool_cli.py \
                   pipeline/editorial_mix_pool.py \
                   pipeline/upstash_mix_pool_transport.py; do
            [ -f "$f" ] || { echo "::error::$f missing — the source ref does not contain the Custom Mix implementation."; exit 1; }
          done
          echo "Implementation present on $(git rev-parse --short HEAD)."

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Gate — the Upstash publisher secrets are provisioned
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_WRITE_TOKEN: ${{ secrets.KV_REST_API_WRITE_TOKEN }}
        run: |
          # Presence only. Neither value is echoed, expanded into a command line or written
          # to the step summary — only this boolean leaves the step.
          if [ -z "${KV_REST_API_URL:-}" ] || [ -z "${KV_REST_API_WRITE_TOKEN:-}" ]; then
            echo "::error::Upstash publisher secrets are not provisioned (see UPSTASH_PROVISIONING.md)."
            exit 1
          fi
          echo "Upstash publisher secrets are present."

      # Live RSS, exactly as the daily job does it. Writes pipeline/candidates.json, which
      # is gitignored and never committed.
      - name: Scout (live RSS)
        run: |
          set -euo pipefail
          python pipeline/scout.py \
            --sources pipeline/sources.yaml \
            --out pipeline/candidates.json \
            --max-age-hours 36 \
            --summary-file "$GITHUB_STEP_SUMMARY"

      # STAGE 1 — scout/ranker candidates -> frozen, validated raw Mix Pool.
      # `prepare_scout_source` drops rows the raw contract cannot represent (empty RSS
      # description, unusable URL, canonical duplicate) BEFORE freezing, and reports the
      # counts. Run 30360578299 died here as an opaque `MixPoolError`; a scout-shape
      # failure now exits 6, distinct from an enrichment failure.
      - name: Custom Mix — build the raw Mix Pool
        env:
          EDITION_DATE: ${{ steps.gate.outputs.date }}
        run: |
          set -euo pipefail
          python pipeline/editorial_mix_pool_cli.py build-raw \
            --input pipeline/candidates.json \
            --date "$EDITION_DATE" \
            --generated-at "$(date -u +%FT%TZ)" \
            --output "$RUNNER_TEMP/raw-mix-pool-$EDITION_DATE.json" \
            | tee "$RUNNER_TEMP/raw-summary.json"
          {
            echo '### Raw Mix Pool (counts and identity prefix only)'
            echo '```json'
            cat "$RUNNER_TEMP/raw-summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # STAGE 2 — revalidate the frozen raw artifact and re-derive its identity.
      - name: Custom Mix — validate the raw Mix Pool
        env:
          EDITION_DATE: ${{ steps.gate.outputs.date }}
        run: |
          set -euo pipefail
          python pipeline/editorial_mix_pool_cli.py validate-raw \
            --artifact "$RUNNER_TEMP/raw-mix-pool-$EDITION_DATE.json"

      # STAGE 3 — enrichment from the FROZEN artifact. Scout output is not accepted here.
      # The raw artifact is revalidated again before any article fetch, so a corrupted
      # intermediate costs zero external work. Fewer than 15 survivors writes nothing.
      - name: Custom Mix — build the Editorial Mix Pool
        env:
          EDITION_DATE: ${{ steps.gate.outputs.date }}
        run: |
          set -euo pipefail
          python pipeline/editorial_mix_pool_cli.py build \
            --raw-input "$RUNNER_TEMP/raw-mix-pool-$EDITION_DATE.json" \
            --date "$EDITION_DATE" \
            --generated-at "$(date -u +%FT%TZ)" \
            --output "$RUNNER_TEMP/editorial-mix-pool-$EDITION_DATE.json" \
            | tee "$RUNNER_TEMP/build-summary.json"
          {
            echo '### Editorial Mix Pool (counts and identity prefixes only)'
            echo '```json'
            cat "$RUNNER_TEMP/build-summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Revalidates the artifact and re-derives BOTH identities before the transport is
      # touched, then issues exactly ONE atomic Upstash SET with TTL 777600.
      - name: Publish to Upstash
        env:
          EDITION_DATE: ${{ steps.gate.outputs.date }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_WRITE_TOKEN: ${{ secrets.KV_REST_API_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          # Secrets reach the process through the environment only — never as an argument,
          # so they cannot appear in a command line, a process listing or the run log.
          python pipeline/editorial_mix_pool_cli.py publish \
            --artifact "$RUNNER_TEMP/editorial-mix-pool-$EDITION_DATE.json" \
            --date "$EDITION_DATE" \
            | tee "$RUNNER_TEMP/publish-summary.json"
          {
            echo '### Publish summary (safe metadata only)'
            echo '```json'
            cat "$RUNNER_TEMP/publish-summary.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Belt and braces: `permissions: contents: read` already makes a repository write
      # impossible, but assert the working tree is untouched anyway.
      - name: Assert the repository is unchanged
        if: always()
        run: |
          set -uo pipefail
          if find . -name 'editorial-mix-pool-*.json' -not -path './.git/*' | grep -q .; then
            echo "::error::a generated Editorial Mix Pool reached the repository"; exit 1
          fi
          CHANGED="$(git status --porcelain -- latest.json editions/ || true)"
          if [ -n "$CHANGED" ]; then
            echo "::error::standard edition files were disturbed:"; echo "$CHANGED"; exit 1
          fi
          echo "Repository clean; latest.json and editions/ untouched."
